name: Pricing ops

# Read and maintain the pricing tables in production D1 from CI, using the
# repo's own CLOUDFLARE_API_TOKEN.
#
# Why this exists: `wrangler` on a laptop authenticates with a single global
# OAuth token, so anyone who runs `wrangler login` for a different Cloudflare
# account silently takes away every other account's access on that machine.
# That happened mid-incident on 2026-08-11 and blocked verification of the
# catalog-sync fix. CI already holds a scoped token for this account, so the
# checks that matter do not depend on whichever account a laptop last logged in
# to.
#
# Modes:
#   report     SELECT only. Catalog contents, cost_source distribution, and the
#              configured credit rates. Safe to run any time.
#   force-sync Sets model_pricing.updated_at = 0 so the next hourly cron must
#              re-sync instead of waiting out the 20h staleness window. Touches
#              one column on a lookup table; no spend data, no prices, and the
#              sync overwrites it on success.
#   set-rates  Upserts the Local Falcon and Rapid URL Indexer credit rates.
#              Without them their credits aggregate as $0, which reads as free
#              rather than as unpriced.
#   prune-stale Deletes model_pricing rows below the last successful sync's
#              watermark, i.e. models the catalog has stopped pricing. upsertMany
#              never deletes, so these survive forever otherwise.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report | force-sync | set-rates"
        required: true
        default: report
        type: choice
        options: [report, force-sync, set-rates, prune-stale]

env:
  CLOUDFLARE_ACCOUNT_ID: 26108e3201e299582e4f6df2912f0b19
  DB: ve-track-prod-db

jobs:
  ops:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install root SDK deps
        working-directory: .
        run: bun install
      - run: bun install

      - name: Force the catalog stale
        if: inputs.mode == 'force-sync'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler d1 execute "$DB" --remote \
            --command "UPDATE model_pricing SET updated_at = 0"

      - name: Set the credit rates
        if: inputs.mode == 'set-rates'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Same mechanism and same tenant as the Ahrefs rate set in PR #46.
          # Both figures are derived from published pricing and are marked as
          # such in `note`, so a stale rate is auditable rather than mysterious.
          # They should be replaced with invoice-derived numbers when one is to
          # hand: a rate a human typed goes stale silently when a plan changes.
          bunx wrangler d1 execute "$DB" --remote --command "
            INSERT INTO provider_credit_prices (id, tenant_id, provider, credit_price_usd, note)
            SELECT 'pcp_localfalcon_' || tenant_id, tenant_id, 'localfalcon', 0.003,
                   'Local Falcon scan credit = one grid pin. From published plan pricing, NOT an invoice. Verify against a real invoice.'
              FROM provider_credit_prices WHERE provider = 'ahrefs'
            ON CONFLICT (tenant_id, provider) DO UPDATE SET
              credit_price_usd = excluded.credit_price_usd,
              note = excluded.note,
              updated_at = current_timestamp;
          "
          bunx wrangler d1 execute "$DB" --remote --command "
            INSERT INTO provider_credit_prices (id, tenant_id, provider, credit_price_usd, note)
            SELECT 'pcp_rapidurlindexer_' || tenant_id, tenant_id, 'rapidurlindexer', 0.045,
                   'Rapid URL Indexer credit = one URL submitted. From published plan pricing, NOT an invoice. Verify against a real invoice.'
              FROM provider_credit_prices WHERE provider = 'ahrefs'
            ON CONFLICT (tenant_id, provider) DO UPDATE SET
              credit_price_usd = excluded.credit_price_usd,
              note = excluded.note,
              updated_at = current_timestamp;
          "

      - name: Prune rows the catalog no longer prices
        if: inputs.mode == 'prune-stale'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # `upsertMany` inserts and updates but never deletes, so a model that
          # the catalog has STOPPED pricing keeps whatever row it had. That
          # matters because `model_pricing` was hand-populated on 2026-08-10
          # while the sync was broken, and that population predates the fix that
          # skips models with no token pricing. Those rows are still sitting
          # there at 0.0, which is exactly the "free at high confidence" defect
          # the skip was added to prevent.
          #
          # A successful sync stamps every row it produced with the same fresh
          # `updated_at`. Anything left below that watermark is a row the
          # catalog no longer produces. Deleting by watermark rather than by
          # price is deliberate: a genuinely free model has a legitimate 0.0 and
          # must survive.
          bunx wrangler d1 execute "$DB" --remote \
            --command "SELECT provider, COUNT(*) AS stale FROM model_pricing WHERE updated_at < (SELECT MAX(updated_at) FROM model_pricing) GROUP BY provider"
          bunx wrangler d1 execute "$DB" --remote \
            --command "DELETE FROM model_pricing WHERE updated_at < (SELECT MAX(updated_at) FROM model_pricing)"

      - name: Report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::group::model_pricing by provider"
          bunx wrangler d1 execute "$DB" --remote \
            --command "SELECT provider, COUNT(*) AS rows, MAX(updated_at) AS latest FROM model_pricing GROUP BY provider ORDER BY provider"
          echo "::endgroup::"

          echo "::group::cost_source distribution, last 24h"
          bunx wrangler d1 execute "$DB" --remote \
            --command "SELECT provider, cost_source, cost_confidence, COUNT(*) AS c, ROUND(SUM(cost_usd), 4) AS usd FROM usage_events WHERE timestamp > (strftime('%s','now') - 86400) * 1000 GROUP BY 1,2,3 ORDER BY c DESC LIMIT 30"
          echo "::endgroup::"

          echo "::group::most recent 15 events"
          bunx wrangler d1 execute "$DB" --remote \
            --command "SELECT provider, action, model, cost_usd, credits_charged, cost_source, cost_confidence, status_code, timestamp FROM usage_events ORDER BY timestamp DESC LIMIT 15"
          echo "::endgroup::"

          # Mirrors resolveEntry: exact id first, then the normalized form with
          # a trailing -YYYY-MM-DD or -NNNNNNNN stripped. An exact-only check
          # reports NO MATCH for ids like `gpt-5-2025-08-07` that the pricer
          # resolves perfectly well, and a diagnostic that cries wolf is worse
          # than none. It still does not model resolveEntry's prefix fallback,
          # so NO MATCH here means "needs a look", not "definitely unpriced".
          #
          # The suffix is stripped from the EVENT side with a constant GLOB.
          # Building a GLOB pattern from a column value fails with
          # "LIKE or GLOB pattern too complex" (SQLITE_ERROR 7500).
          echo "::group::do repriced-provider model ids resolve against the catalog"
          bunx wrangler d1 execute "$DB" --remote \
            --command "
              WITH ev AS (
                SELECT provider, model, COUNT(*) AS events, lower(model) AS raw
                  FROM usage_events
                 WHERE provider IN ('openai','anthropic','gemini','openrouter')
                   AND model IS NOT NULL
                   AND timestamp > (strftime('%s','now') - 172800) * 1000
                 GROUP BY 1, 2
              ), norm AS (
                SELECT ev.*,
                       CASE
                         WHEN raw GLOB '*-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]' THEN substr(raw, 1, length(raw) - 11)
                         WHEN raw GLOB '*-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'   THEN substr(raw, 1, length(raw) - 9)
                         ELSE raw
                       END AS stripped
                  FROM ev
              )
              SELECT n.provider, n.model, n.events,
                     CASE WHEN EXISTS (
                       SELECT 1 FROM model_pricing p
                        WHERE p.provider = n.provider
                          AND lower(p.model_id) IN (n.raw, n.stripped)
                     ) THEN 'resolves' ELSE 'NO MATCH' END AS catalog
                FROM norm n
               ORDER BY n.events DESC
               LIMIT 20"
          echo "::endgroup::"

          echo "::group::configured credit rates"
          bunx wrangler d1 execute "$DB" --remote \
            --command "SELECT provider, credit_price_usd, note, updated_at FROM provider_credit_prices ORDER BY provider"
          echo "::endgroup::"
